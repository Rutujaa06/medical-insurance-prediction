
<!DOCTYPE html>
<html>
<head>
    <title>Medical Insurance Prediction</title>
</head>
<body>
    <h1>Medical Insurance Cost Prediction</h1>

    <form action="/predict" method="POST">
        <label>Age:</label>
        <input type="number" name="age" required>

        <br><br>

        <label>Sex:</label>
        <select name="sex">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <br><br>

        <label>BMI:</label>
        <input type="number" step="any" name="bmi" required>

        <br><br>

        <label>Children:</label>
        <input type="number" name="children" required>

        <br><br>

        <label>Smoker:</label>
        <select name="smoker">
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <br><br>

        <label>Region:</label>
        <select name="region">
            <option value="southwest">Southwest</option>
            <option value="southeast">Southeast</option>
            <option value="northwest">Northwest</option>
            <option value="northeast">Northeast</option>
        </select>

        <br><br>

        <button type="submit">Predict Insurance Cost</button>
    </form>
</body>
</html>
